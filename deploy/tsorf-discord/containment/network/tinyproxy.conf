# tinyproxy — egress allowlist for the locked Hermes network.
#
# Trust model: the agent container sits on an `internal: true` Docker network with
# NO route to the internet. Its ONLY peer that can reach outside is THIS proxy
# (which also sits on an external bridge). So:
#   * a direct socket from the agent to any external IP has no route → dropped (L3).
#   * any request the agent DOES send here is allowed only if its destination host
#     matches allowlist.filter (FilterDefaultDeny On) → default-deny (L7).
# Together that is genuine network egress default-deny.

User tinyproxy
Group tinyproxy

# Listen on all interfaces of THIS container (it is only attached to the internal
# net + egress bridge; client ACL below restricts who may use it).
Port 8888
Timeout 600

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"
LogLevel Info

MaxClients 200

# --- Client ACL: only the internal Hermes subnet may use the proxy. ---
# The subnet is pinned in docker-compose.locked.yml (hermes-internal: 172.31.7.0/24).
# Everything not explicitly Allowed is denied.
Allow 127.0.0.1
Allow 172.31.7.0/24

# --- Destination ACL: default-deny + allowlist. ---
# With FilterDefaultDeny On, ONLY hosts matching a regex in the filter file are
# reachable. Extended (ERE) + case-insensitive; matched against the destination
# host for both plain HTTP and CONNECT (HTTPS) requests.
Filter "/etc/tinyproxy/allowlist.filter"
FilterDefaultDeny On
FilterExtended On
FilterCaseSensitive Off

# --- CONNECT (HTTPS tunnel) port allowlist. ---
# Only 443 is needed (Discord gateway WS + REST, Tavily). The host model proxy is
# plain HTTP on :8787 and is reached via normal forward-proxying, NOT CONNECT, so
# it does not need a ConnectPort entry. Listing ports here makes CONNECT to any
# other port a hard error.
ConnectPort 443
